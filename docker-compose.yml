x-common-env: &common-env
  DATABASE_URL: ${DATABASE_URL:-}
  POSTGRES_DB: ${POSTGRES_DB:-dnd_firegory}
  POSTGRES_USER: ${POSTGRES_USER:-dnd}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dnd_dev_password}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  AUTH_SECRET: ${AUTH_SECRET:-}
  ZAI_API_KEY: ${ZAI_API_KEY:-}
  STORAGE_ROOT: ${STORAGE_ROOT:-/app/storage}

services:
  app:
    build:
      context: .
      target: dev
    command: >
      sh -c 'export DATABASE_URL="$${DATABASE_URL:-postgresql://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB}}";
      npm run dev -- --hostname 0.0.0.0'
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      <<: *common-env
      APP_URL: ${APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - app_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      target: dev
    command: >
      sh -c 'export DATABASE_URL="$${DATABASE_URL:-postgresql://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB}}";
      node -e "console.log('"'"'Worker placeholder started. Ingestion/RAG worker will be implemented in a later issue.'"'"'); setInterval(() => {}, 60_000);"'
    environment:
      <<: *common-env
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - app_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dnd_firegory}
      POSTGRES_USER: ${POSTGRES_USER:-dnd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dnd_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    # Development-only Redis instance; unauthenticated and host-exposed for local tooling.
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  app_storage:
  node_modules:
  postgres_data:
  redis_data:

x-common-env: &common-env
  DATABASE_URL: ${DATABASE_URL:-}
  POSTGRES_DB: ${POSTGRES_DB:-dnd_firegory}
  POSTGRES_USER: ${POSTGRES_USER:-dnd}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dnd_dev_password}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  AUTH_SECRET: ${AUTH_SECRET:-}
  ZAI_API_KEY: ${ZAI_API_KEY:-}
  # Generic embedding config (fallback for both ingestion and query)
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-zai}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
  # z.ai embedding
  ZAI_EMBEDDING_BASE_URL: ${ZAI_EMBEDDING_BASE_URL:-}
  ZAI_EMBEDDING_MODEL: ${ZAI_EMBEDDING_MODEL:-}
  ZAI_EMBEDDING_DIMENSIONS: ${ZAI_EMBEDDING_DIMENSIONS:-}
  # Ollama embedding
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
  OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3}
  OLLAMA_EMBEDDING_DIMENSIONS: ${OLLAMA_EMBEDDING_DIMENSIONS:-1024}
  OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-1m}
  # Ingestion-specific embedding config (worker)
  INGESTION_EMBEDDING_PROVIDER: ${INGESTION_EMBEDDING_PROVIDER:-}
  INGESTION_OLLAMA_BASE_URL: ${INGESTION_OLLAMA_BASE_URL:-}
  INGESTION_OLLAMA_EMBEDDING_MODEL: ${INGESTION_OLLAMA_EMBEDDING_MODEL:-}
  INGESTION_OLLAMA_EMBEDDING_DIMENSIONS: ${INGESTION_OLLAMA_EMBEDDING_DIMENSIONS:-}
  INGESTION_OLLAMA_KEEP_ALIVE: ${INGESTION_OLLAMA_KEEP_ALIVE:-}
  # Query-specific embedding config (vector search)
  QUERY_EMBEDDING_PROVIDER: ${QUERY_EMBEDDING_PROVIDER:-}
  QUERY_OLLAMA_BASE_URL: ${QUERY_OLLAMA_BASE_URL:-}
  QUERY_OLLAMA_EMBEDDING_MODEL: ${QUERY_OLLAMA_EMBEDDING_MODEL:-}
  QUERY_OLLAMA_EMBEDDING_DIMENSIONS: ${QUERY_OLLAMA_EMBEDDING_DIMENSIONS:-}
  QUERY_OLLAMA_KEEP_ALIVE: ${QUERY_OLLAMA_KEEP_ALIVE:-}
  # LLM config
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-}
  LLM_TEMPERATURE: ${LLM_TEMPERATURE:-}
  STORAGE_ROOT: ${STORAGE_ROOT:-/app/storage}

services:
  app:
    build:
      context: .
      target: dev
    entrypoint: ["./docker/entrypoint.dev.sh"]
    command: npm run dev -- --hostname 0.0.0.0
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      <<: *common-env
      APP_URL: ${APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - app_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      target: dev
    entrypoint: ["./docker/entrypoint.dev.sh"]
    command: npm run worker
    environment:
      <<: *common-env
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - app_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dnd_firegory}
      POSTGRES_USER: ${POSTGRES_USER:-dnd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dnd_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    # Development-only Redis instance; unauthenticated and host-exposed for local tooling.
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  app_storage:
  node_modules:
  postgres_data:
  redis_data:

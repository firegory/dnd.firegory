x-runtime-environment: &runtime-environment
  NODE_ENV: production
  DATABASE_URL_FILE: /run/secrets/database_url
  REDIS_URL_FILE: /run/secrets/redis_url
  AUTH_SECRET_FILE: /run/secrets/auth_secret
  ZAI_API_KEY_FILE: /run/secrets/zai_api_key
  LLM_API_KEY_FILE: /run/secrets/llm_api_key
  STORAGE_ROOT: /app/storage
  PUBLICATION_SPOOL_ROOT: /app/storage/publication-spool
  DND_DATA_ROOT: ${DND_DATA_ROOT:?Set DND_DATA_ROOT to the host-mounted NFSv4 path}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-zai}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_MODEL: ${LLM_MODEL:-}

x-runtime-secrets: &runtime-secrets
  - database_url
  - redis_url
  - auth_secret
  - zai_api_key
  - llm_api_key

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *service-defaults
    build:
      context: .
      target: app-production
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      <<: *runtime-environment
      APP_URL: ${APP_URL:?Set APP_URL to the public application URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-${APP_URL}}
    secrets: *runtime-secrets
    volumes:
      - type: bind
        source: ${DND_DATA_ROOT}
        target: ${DND_DATA_ROOT}
        read_only: true
      - upload_spool:/app/storage
    healthcheck:
      test: ["CMD", "node", "scripts/app-healthcheck.mjs"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "${APP_CPU_LIMIT:-1.0}"
          memory: ${APP_MEMORY_LIMIT:-1G}

  worker:
    <<: *service-defaults
    build:
      context: .
      target: worker-production
    user: "${WORKER_UID:-10001}:${WORKER_GID:-10001}"
    environment: *runtime-environment
    secrets: *runtime-secrets
    volumes:
      - type: bind
        source: ${DND_DATA_ROOT}
        target: ${DND_DATA_ROOT}
        read_only: false
      - upload_spool:/app/storage
    healthcheck:
      test: ["CMD", "node", "scripts/worker-healthcheck.mjs"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPU_LIMIT:-2.0}"
          memory: ${WORKER_MEMORY_LIMIT:-2G}

  gateway:
    <<: *service-defaults
    build:
      context: .
      target: agent-gateway
    user: "${GATEWAY_UID:-10001}:${GATEWAY_GID:-10001}"
    ports:
      - "${AGENT_GATEWAY_PORT:-8787}:8787"
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      AGENT_GATEWAY_HOST: 0.0.0.0
      AGENT_GATEWAY_PORT: 8787
      AGENT_GATEWAY_TOKENS_FILE: /run/secrets/agent_token_policies
      AGENT_GATEWAY_CURSOR_SECRET_FILE: /run/secrets/agent_cursor_key
      DND_DATA_ROOT: ${DND_DATA_ROOT}
    secrets:
      - database_url
      - agent_token_policies
      - agent_cursor_key
    volumes:
      - type: bind
        source: ${DND_DATA_ROOT}
        target: ${DND_DATA_ROOT}
        read_only: true
    healthcheck:
      test: ["CMD", "npm", "run", "agent-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "${GATEWAY_CPU_LIMIT:-0.5}"
          memory: ${GATEWAY_MEMORY_LIMIT:-512M}

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dnd_firegory}
      POSTGRES_USER: ${POSTGRES_USER:-dnd}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPU_LIMIT:-1.0}"
          memory: ${POSTGRES_MEMORY_LIMIT:-1G}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - exec redis-server --appendonly yes --requirepass "$$(tr -d '\r\n' < /run/secrets/redis_password)"
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$(tr -d '\r\n' < /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPU_LIMIT:-0.5}"
          memory: ${REDIS_MEMORY_LIMIT:-512M}

volumes:
  upload_spool:
  postgres_data:
  redis_data:

secrets:
  database_url:
    file: ${PRODUCTION_SECRETS_ROOT:-./secrets}/database-url
  postgres_password:
    file: ${PRODUCTION_SECRETS_ROOT:-./secrets}/postgres-password
  redis_url:
    file: ${PRODUCTION_SECRETS_ROOT:-./secrets}/redis-url
  redis_password:
    file: ${PRODUCTION_SECRETS_ROOT:-./secrets}/redis-password
  auth_secret:
    file: ${PRODUCTION_SECRETS_ROOT:-./secrets}/auth-secret
  zai_api_key:
    file: ${PRODUCTION_SECRETS_ROOT:-./secrets}/zai-api-key
  llm_api_key:
    file: ${PRODUCTION_SECRETS_ROOT:-./secrets}/llm-api-key
  agent_token_policies:
    file: ${PRODUCTION_SECRETS_ROOT:-./secrets}/agent-token-policies.json
  agent_cursor_key:
    file: ${PRODUCTION_SECRETS_ROOT:-./secrets}/agent-cursor-key
